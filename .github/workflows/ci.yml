name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Validar Docker Compose
        working-directory: .
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.override.yml config -q

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check app tests alembic

      - name: Ruff format
        run: ruff format --check app tests alembic

      - name: Vulture (código muerto)
        run: vulture app --min-confidence 70

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - name: Deno check
        run: deno task check

      - name: Deno test
        run: deno test -A tests/

      - name: Deno build
        run: deno task build

  migraciones:
    name: Migraciones (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: siaugesmat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/siaugesmat_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Alembic check (sin drift)
        run: alembic check

      - name: Smoke de esquema contra PostgreSQL
        run: pytest tests/test_endpoints_api.py tests/test_endpoint_analitica.py tests/test_endpoint_consultas.py tests/test_contrato_migraciones.py -q