events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    server_tokens   off;
    keepalive_timeout  65;
    client_max_body_size 50M;
    client_body_timeout 120s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Redactar el token de Moodle (wstoken) de las URLs registradas en los
    # logs de acceso. El token viaja como query param en algunas llamadas de
    # la API REST de Moodle; evitar su fuga en access_log es defensa en
    # profundidad (la mitigación principal es usar POST en el cliente).
    map $request_uri $uri_sin_token {
        ~(?i)^(?<pre>.*[?&]wstoken=)[^&]+(?<post>.*)$  "${pre}REDACTED${post}";
        default                                       $request_uri;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri_sin_token $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # DNS embebido de Docker: permite resolver los upstreams (backend/frontend)
    # por petición en vez de al arranque, evitando 502 al recrear contenedores.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_http_version 1.1;

        # Frontend
        location / {
            set $upstream_frontend frontend;
            proxy_pass http://$upstream_frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Backend API
        location /api/ {
            set $upstream_backend backend;
            proxy_pass http://$upstream_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Backend docs
        location /docs {
            set $upstream_backend backend;
            proxy_pass http://$upstream_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /openapi.json {
            set $upstream_backend backend;
            proxy_pass http://$upstream_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /redoc {
            set $upstream_backend backend;
            proxy_pass http://$upstream_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
