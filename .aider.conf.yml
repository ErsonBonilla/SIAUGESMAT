# .aider.conf.yml - Configuracion de Aider para SIAUGESMAT
# Mas informacion: https://aider.chat/docs/config.html
#
# IMPORTANTE: mantener ASCII puro (sin acentos) para evitar errores de
# codificacion (cp1252) al leer el archivo en Windows.

# --- Modelo y Comportamiento General ---
# DeepSeek V4.1-Flash (1M de contexto, salida hasta 384K, thinking nativo,
# function calling, rapido y economico). Ajustes en .aider.model.settings.yml.
# Para cambiar a V4-Pro en una sesion: --model deepseek/deepseek-v4-pro o /model
model: deepseek/deepseek-flash
# Mismo modelo como "debil": evita que aider llame a OpenAI por defecto.
weak-model: deepseek/deepseek-flash
# Ediciones quirurgicas por diff. NUNCA "whole" (reescribe archivos enteros).
edit-format: diff
# Commits manuales revisados (el estilo de commit del proyecto es manual).
auto-commits: false
# Sin firma "Co-Authored-By" para mantener los commits limpios.
attribute-author: false
attribute-committer: false
# DeepSeek V4.1-Flash soporta 1M de contexto; mapa del repo mas generoso que
# el default (1024) para que el agente "vea" mejor la estructura al auditar.
map-tokens: 4096
# Cache de prompts y timeout amplio para auditorias con thinking activo.
cache-prompts: true
timeout: 300
# Guardar historiales en .aider/ para no ensuciar la raiz del repositorio.
input-history-file: .aider/input.history
chat-history-file: .aider/chat.history.md

# --- Idioma ---
# El codigo y los commits estan en espanol.
chat-language: Spanish
commit-language: Spanish

# --- Clave de API ---
# La clave se lee de la variable de entorno DEEPSEEK_API_KEY.
# Este archivo carga el .env raiz del repo (gitignored), donde puedes anadir:
#   DEEPSEEK_API_KEY=sk-...
# NO pegues la clave en este archivo: quedaria en el repositorio.
env-file: .env

# --- Contexto de auditoria (solo lectura) ---
# AGENTS.md y los tests de contrato documentan los contratos externos y las
# trampas conocidas. Cargarlos como solo-lectura garantiza que el agente los
# respete al auditar o editar. El agente NO puede modificarlos.
read:
  - AGENTS.md
  - backend/tests/test_contrato_wire.py
  - backend/tests/test_contrato_celery.py
  - backend/tests/test_contrato_sql_espanol.py
  - backend/tests/test_contrato_lifespan.py
  - backend/tests/test_pureza_pipeline.py

