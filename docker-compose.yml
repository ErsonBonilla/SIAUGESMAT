# ============================================================================
# SIAUGESMAT – Sistema de Integración y Automatización para la Gestión
#               de Matrículas en Moodle
# ============================================================================

x-backend-env: &backend-env
  # FastAPI / Proyecto
  PROJECT_NAME: SIAUGESMAT
  DEBUG: ${DEBUG:-false}
  ALLOW_PRESENCIAL: ${ALLOW_PRESENCIAL:-false}

  # Moodle
  MOODLE_URL: ${MOODLE_URL:-}
  MOODLE_ADMIN_TOKEN: ${MOODLE_ADMIN_TOKEN:-}
  MOODLE_VERSION: ${MOODLE_VERSION:-3.9}

  # Moodle - Configuración por modalidad (lee de .env raíz)
  # Si la var específica no está definida, se usa el fallback genérico
  MOODLE_URL__PRESENCIAL: ${MOODLE_URL__PRESENCIAL:-}
  MOODLE_TOKEN__PRESENCIAL: ${MOODLE_TOKEN__PRESENCIAL:-}
  MOODLE_VERSION__PRESENCIAL: ${MOODLE_VERSION__PRESENCIAL:-3.8}
  MOODLE_URL__DISTANCIA: ${MOODLE_URL__DISTANCIA:-}
  MOODLE_TOKEN__DISTANCIA: ${MOODLE_TOKEN__DISTANCIA:-}
  MOODLE_VERSION__DISTANCIA: ${MOODLE_VERSION__DISTANCIA:-3.9}

  # Base de datos
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

  # Redis
  REDIS_URL: redis://redis:6379/0

  # Rate limiting contra Moodle
  MOODLE_MAX_REQUESTS_PER_SECOND: ${MOODLE_MAX_REQUESTS_PER_SECOND:-5}
  MOODLE_BURST_SIZE: ${MOODLE_BURST_SIZE:-10}

  # Seguridad JWT
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}

  # Rate limiting del login (protección contra fuerza bruta)
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
  LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}

  # Umbrales del semáforo de analítica
  ANALYTICS_ERROR_THRESHOLD_YELLOW: ${ANALYTICS_ERROR_THRESHOLD_YELLOW:-1.0}
  ANALYTICS_ERROR_THRESHOLD_RED: ${ANALYTICS_ERROR_THRESHOLD_RED:-5.0}
  ANALYTICS_MAX_DURATION_YELLOW: ${ANALYTICS_MAX_DURATION_YELLOW:-3600}
  ANALYTICS_MAX_DURATION_RED: ${ANALYTICS_MAX_DURATION_RED:-7200}

  # Subida de archivos y reportes
  UPLOAD_DIR: /app/uploads
  REPORT_DIR: /app/reports

  # CORS
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000,http://localhost:8100,https://localhost}

  # Job timeout (segundos)
  JOB_TIMEOUT: ${JOB_TIMEOUT:-28800}

  # Recuperación de fases atascadas
  CHORD_ACTIVE_MINUTES: ${CHORD_ACTIVE_MINUTES:-15}
  STUCK_EXECUTION_TIMEOUT: ${STUCK_EXECUTION_TIMEOUT:-21600}
  MAX_AUTO_DELETE_COURSES: ${MAX_AUTO_DELETE_COURSES:-500}

  # Timeout y reintentos de red a Moodle
  MOODLE_REQUEST_TIMEOUT: ${MOODLE_REQUEST_TIMEOUT:-60.0}
  MOODLE_MAX_RETRIES: ${MOODLE_MAX_RETRIES:-3}

  # Umbral único de antigüedad máxima de cursos para eliminación (segundos — 24 meses y 1 día)
  COURSE_MAX_AGE_SECONDS: ${COURSE_MAX_AGE_SECONDS:-62294400}

  # Plantilla de curso para ETL
  DEFAULT_COURSE_TEMPLATE: ${DEFAULT_COURSE_TEMPLATE:-}

  # Consolidación de cuentas externas y exclusiones (FASE 1)
  MOODLE_EXTERNAL_AUTH: ${MOODLE_EXTERNAL_AUTH:-db}
  EXTERNAL_AUTH_EXCLUDED_USERS: ${EXTERNAL_AUTH_EXCLUDED_USERS:-}

services:
  # --------------------------------------------------------------------------
  # 1. Base de datos PostgreSQL
  # --------------------------------------------------------------------------
  db:
    image: postgres:18.6
    container_name: siaugesmat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Ajustes de rendimiento recomendados para cargas semestrales
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - siaugesmat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # 2. Redis (cola de tareas Celery)
  # --------------------------------------------------------------------------
  redis:
    image: redis:8.10.1-alpine
    container_name: siaugesmat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - siaugesmat-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------------------
  # 3. Migraciones Alembic (one-shot: aplica el esquema y termina)
  # --------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: siaugesmat-backend:latest
    container_name: siaugesmat-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      # Base de datos
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - siaugesmat-net
    depends_on:
      db:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # 4. API Backend (FastAPI)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: siaugesmat-backend:latest
    container_name: siaugesmat-backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
    networks:
      - siaugesmat-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --------------------------------------------------------------------------
  # 5. Worker Celery (procesamiento ETL)
  # --------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: siaugesmat-backend:latest
    container_name: siaugesmat-worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=1 --prefetch-multiplier=1
    deploy:
      resources:
        limits:
          memory: 2g
    environment: *backend-env
    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
    networks:
      - siaugesmat-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --------------------------------------------------------------------------
  # 6. Celery Beat (tareas periódicas)
  # --------------------------------------------------------------------------
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: siaugesmat-backend:latest
    container_name: siaugesmat-beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    environment: *backend-env
    networks:
      - siaugesmat-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --------------------------------------------------------------------------
  # 7. Frontend (Fresh / Deno)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: siaugesmat-frontend:latest
    container_name: siaugesmat-frontend
    restart: unless-stopped
    environment:
      # El frontend apunta internamente al backend
      BACKEND_URL: http://backend:8000/api/v1
      DOCKER_ENV: "1"
    networks:
      - siaugesmat-net
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const r = await fetch('http://127.0.0.1:3000/ingreso'); if (!r.ok) Deno.exit(1);",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # 8. Nginx (reverse proxy HTTPS)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: siaugesmat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - siaugesmat-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

# ============================================================================
# Volúmenes persistentes
# ============================================================================
volumes:
  pgdata:
    name: siaugesmat_pgdata
  redisdata:
    name: siaugesmat_redisdata
  uploads:
    name: siaugesmat_uploads
  reports:
    name: siaugesmat_reports

# ============================================================================
# Red común para todos los servicios
# ============================================================================
networks:
  siaugesmat-net:
    name: siaugesmat-net
    driver: bridge