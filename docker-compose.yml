# ============================================================================
# SIAUGESMAT – Sistema de Integración y Automatización para la Gestión
#               de Matrículas en Moodle
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. Base de datos PostgreSQL
  # --------------------------------------------------------------------------
  db:
    image: postgres:17.9
    container_name: siaugesmat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Ajustes de rendimiento recomendados para cargas semestrales
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - siaugesmat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # 2. Redis (cola de tareas Celery)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: siaugesmat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - siaugesmat-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------------------
  # 3. Migraciones Alembic (one-shot: aplica el esquema y termina)
  # --------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: siaugesmat-backend:latest
    container_name: siaugesmat-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      # Base de datos
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - siaugesmat-net
    depends_on:
      db:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # 4. API Backend (FastAPI)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: siaugesmat-backend:latest
    container_name: siaugesmat-backend
    restart: unless-stopped
    environment:
      # FastAPI / Proyecto
      PROJECT_NAME: SIAUGESMAT
      DEBUG: ${DEBUG}
      ALLOW_PRESENCIAL: ${ALLOW_PRESENCIAL}

      # Moodle
      MOODLE_URL: ${MOODLE_URL}
      MOODLE_ADMIN_TOKEN: ${MOODLE_ADMIN_TOKEN}
      MOODLE_VERSION: ${MOODLE_VERSION}

      # Moodle - Configuración por modalidad (lee de .env raíz)
      # Si la var específica no está definida, se usa el fallback genérico
      MOODLE_URL__PRESENCIAL: ${MOODLE_URL__PRESENCIAL}
      MOODLE_TOKEN__PRESENCIAL: ${MOODLE_TOKEN__PRESENCIAL}
      MOODLE_VERSION__PRESENCIAL: ${MOODLE_VERSION__PRESENCIAL}
      MOODLE_URL__DISTANCIA: ${MOODLE_URL__DISTANCIA}
      MOODLE_TOKEN__DISTANCIA: ${MOODLE_TOKEN__DISTANCIA}
      MOODLE_VERSION__DISTANCIA: ${MOODLE_VERSION__DISTANCIA}

      # Base de datos
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Rate limiting contra Moodle
      MOODLE_MAX_REQUESTS_PER_SECOND: ${MOODLE_MAX_REQUESTS_PER_SECOND}
      MOODLE_BURST_SIZE: ${MOODLE_BURST_SIZE}

      # Seguridad JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}

      # Umbrales del semáforo de analítica
      ANALYTICS_ERROR_THRESHOLD_YELLOW: ${ANALYTICS_ERROR_THRESHOLD_YELLOW}
      ANALYTICS_ERROR_THRESHOLD_RED: ${ANALYTICS_ERROR_THRESHOLD_RED}
      ANALYTICS_MAX_DURATION_YELLOW: ${ANALYTICS_MAX_DURATION_YELLOW}
      ANALYTICS_MAX_DURATION_RED: ${ANALYTICS_MAX_DURATION_RED}

      # Subida de archivos
      UPLOAD_DIR: /app/uploads

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS}

      # Job timeout (segundos)
      JOB_TIMEOUT: ${JOB_TIMEOUT}

      # Recuperación de fases atascadas
      CHORD_ACTIVE_MINUTES: ${CHORD_ACTIVE_MINUTES:-15}
      STUCK_EXECUTION_TIMEOUT: ${STUCK_EXECUTION_TIMEOUT:-21600}
      MAX_AUTO_DELETE_COURSES: ${MAX_AUTO_DELETE_COURSES:-500}

      # Timeout y reintentos de red a Moodle
      MOODLE_REQUEST_TIMEOUT: ${MOODLE_REQUEST_TIMEOUT:-60.0}
      MOODLE_MAX_RETRIES: ${MOODLE_MAX_RETRIES:-3}

      # Umbrales de comparación de cursos (segundos)
      COURSE_MAX_AGE_SECONDS: ${COURSE_MAX_AGE_SECONDS}
      COURSE_DISAPPEARED_AGE_SECONDS: ${COURSE_DISAPPEARED_AGE_SECONDS}

      # Plantilla de curso para ETL
      DEFAULT_COURSE_TEMPLATE: ${DEFAULT_COURSE_TEMPLATE}

      # Cuentas externas excluidas de la consolidación de duplicados (admins)
      EXTERNAL_AUTH_EXCLUDED_USERS: ${EXTERNAL_AUTH_EXCLUDED_USERS}

      # Directorio de reportes
      REPORT_DIR: /app/reports

    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
    networks:
      - siaugesmat-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --------------------------------------------------------------------------
  # 5. Worker Celery (procesamiento ETL)
  # --------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: siaugesmat-backend:latest
    container_name: siaugesmat-worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=1 --prefetch-multiplier=1
    deploy:
      resources:
        limits:
          memory: 2g
    environment:
      # Mismas variables que el backend para que el worker pueda operar
      MOODLE_URL: ${MOODLE_URL}
      MOODLE_ADMIN_TOKEN: ${MOODLE_ADMIN_TOKEN}
      MOODLE_VERSION: ${MOODLE_VERSION}

      # Moodle - Configuración por modalidad (lee de .env raíz)
      MOODLE_URL__PRESENCIAL: ${MOODLE_URL__PRESENCIAL}
      MOODLE_TOKEN__PRESENCIAL: ${MOODLE_TOKEN__PRESENCIAL}
      MOODLE_VERSION__PRESENCIAL: ${MOODLE_VERSION__PRESENCIAL}
      MOODLE_URL__DISTANCIA: ${MOODLE_URL__DISTANCIA}
      MOODLE_TOKEN__DISTANCIA: ${MOODLE_TOKEN__DISTANCIA}
      MOODLE_VERSION__DISTANCIA: ${MOODLE_VERSION__DISTANCIA}

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0

      MOODLE_MAX_REQUESTS_PER_SECOND: ${MOODLE_MAX_REQUESTS_PER_SECOND}
      MOODLE_BURST_SIZE: ${MOODLE_BURST_SIZE}

      UPLOAD_DIR: /app/uploads
      JOB_TIMEOUT: ${JOB_TIMEOUT}

      # Recuperación de fases atascadas
      CHORD_ACTIVE_MINUTES: ${CHORD_ACTIVE_MINUTES:-15}
      STUCK_EXECUTION_TIMEOUT: ${STUCK_EXECUTION_TIMEOUT:-21600}
      MAX_AUTO_DELETE_COURSES: ${MAX_AUTO_DELETE_COURSES:-500}

      # Timeout y reintentos de red a Moodle
      MOODLE_REQUEST_TIMEOUT: ${MOODLE_REQUEST_TIMEOUT:-60.0}
      MOODLE_MAX_RETRIES: ${MOODLE_MAX_RETRIES:-3}

      # Umbrales de comparación de cursos (segundos)
      COURSE_MAX_AGE_SECONDS: ${COURSE_MAX_AGE_SECONDS}
      COURSE_DISAPPEARED_AGE_SECONDS: ${COURSE_DISAPPEARED_AGE_SECONDS}

      DEFAULT_COURSE_TEMPLATE: ${DEFAULT_COURSE_TEMPLATE}

      # Cuentas externas excluidas de la consolidación de duplicados (admins)
      EXTERNAL_AUTH_EXCLUDED_USERS: ${EXTERNAL_AUTH_EXCLUDED_USERS}

      ALLOW_PRESENCIAL: ${ALLOW_PRESENCIAL}
      DEBUG: ${DEBUG}

      REPORT_DIR: /app/reports

    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
    networks:
      - siaugesmat-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --------------------------------------------------------------------------
  # 6. Celery Beat (tareas periódicas)
  # --------------------------------------------------------------------------
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: siaugesmat-backend:latest
    container_name: siaugesmat-beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DEBUG: ${DEBUG}
    networks:
      - siaugesmat-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --------------------------------------------------------------------------
  # 7. Frontend (Fresh / Deno)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: siaugesmat-frontend:latest
    container_name: siaugesmat-frontend
    restart: unless-stopped
    environment:
      # El frontend apunta internamente al backend
      BACKEND_URL: http://backend:8000/api/v1
      DOCKER_ENV: "1"
    networks:
      - siaugesmat-net
    depends_on:
      - backend

  # --------------------------------------------------------------------------
  # 8. Nginx (reverse proxy HTTPS)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: siaugesmat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - siaugesmat-net
    depends_on:
      - backend
      - frontend

# ============================================================================
# Volúmenes persistentes
# ============================================================================
volumes:
  pgdata:
    name: siaugesmat_pgdata
  redisdata:
    name: siaugesmat_redisdata
  uploads:
    name: siaugesmat_uploads
  reports:
    name: siaugesmat_reports

# ============================================================================
# Red común para todos los servicios
# ============================================================================
networks:
  siaugesmat-net:
    name: siaugesmat-net
    driver: bridge