[pytest]
# Los tests de integración real contra Moodle se excluyen por defecto;
# ejecutarlos explícitamente con: pytest -m integration
addopts = -m "not integration"
# Hace que `app` sea importable tanto con `python -m pytest` como con el
# script de consola `pytest` (este último no añade el cwd a sys.path).
pythonpath = .
