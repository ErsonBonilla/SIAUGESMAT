services:
  db:
    ports: ["127.0.0.1:5432:5432"]
  redis:
    # 6380 en el host (el 6379 suele estar ocupado por svchost en Windows)
    ports: ["127.0.0.1:6380:6379"]
  backend:
    volumes:
      - ./backend/app:/app/app:ro
    ports: ["127.0.0.1:8100:8000"]
  worker:
    volumes:
      - ./backend/app:/app/app:ro
  beat:
    volumes:
      - ./backend/app:/app/app:ro
  frontend:
    ports: ["127.0.0.1:3000:3000"]

